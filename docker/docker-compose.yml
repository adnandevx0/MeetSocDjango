version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: meetsoc
      POSTGRES_USER: meetsoc_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meetsoc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: daphne -b 0.0.0.0 -p 8000 config.asgi:application
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      DB_NAME: meetsoc
      DB_USER: meetsoc_user
      DB_PASSWORD: ${DB_PASSWORD:-meetsoc}
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - db
      - redis
    volumes:
      - ..:/app
      - media_files:/app/media
    ports:
      - "8000:8000"

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A celery_tasks worker --loglevel=info --concurrency=4
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: db
      DB_NAME: meetsoc
      DB_USER: meetsoc_user
      DB_PASSWORD: ${DB_PASSWORD:-meetsoc}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - db
      - redis
    volumes:
      - ..:/app

  celery_beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: celery -A celery_tasks beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      SECRET_KEY: ${SECRET_KEY}
      DB_HOST: db
      DB_NAME: meetsoc
      DB_USER: meetsoc_user
      DB_PASSWORD: ${DB_PASSWORD:-meetsoc}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - db
      - redis
    volumes:
      - ..:/app

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_files:/media
    ports:
      - "80:80"
    depends_on:
      - web

volumes:
  postgres_data:
  redis_data:
  media_files:
