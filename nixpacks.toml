# Nixpacks configuration for Django (Daphne/Channels)
providers = ["python"]

[phases.setup]
# নির্দিষ্ট আর্কাইভ এবং প্যাকেজ সেটআপ
nixpkgsArchive = "bc8f8d1be58e8c8383e683a06e1e1e57893fff87"
pkgs = ["python3", "gcc", "postgresql"]

[phases.install]
# ভার্চুয়াল এনভায়রনমেন্ট তৈরি করে ডিপেন্ডেন্সি ইন্সটল করা (সবচেয়ে নিরাপদ পদ্ধতি)
cmds = [
    "python3 -m venv /app/.venv",
    "/app/.venv/bin/pip install --upgrade pip",
    "/app/.venv/bin/pip install -r requirements/production.txt"
]

[phases.build]
# স্ট্যাটিক ফাইল কালেকশন
cmds = [
    "DJANGO_SETTINGS_MODULE=config.settings.production /app/.venv/bin/python manage.py collectstatic --noinput"
]

[start]
# কমান্ডটি রান করার চেষ্টা করবে, ফেইল করলে কন্টেইনার সচল রেখে লগ দেখাবে
cmd = "/app/.venv/bin/python manage.py migrate --noinput && /app/.venv/bin/daphne -b 0.0.0.0 -p 8000 config.asgi:application || tail -f /dev/null"


[variables]
PORT = "8000"
